[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app.py", "lisbon_scene", "tests"]
exclude = ["data"]

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true
