services:
  scene:
    build:
      context: .
      # The default build bridge is 1500 bytes. A WireGuard tunnel at 1280
      # accepts the TCP handshake and then drops the download, so apt and pip
      # time out. The host interface already uses the tunnel MTU.
      network: host
    ports:
      - "8765:8765"
    environment:
      SCENE_HOST: 0.0.0.0
      SCENE_PORT: "8765"
      # From the shell, or from a gitignored .env beside this file. Empty when
      # neither is set. The image build does not receive the key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - scene-data:/app/data

networks:
  default:
    driver: bridge
    driver_opts:
      # Catalog downloads and the optional model call leave this container.
      # Match the build workaround so those transfers fit the tunnel too.
      com.docker.network.driver.mtu: "1280"

volumes:
  scene-data:
